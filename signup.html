<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up</title>

    <!-- Lato font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
        rel="stylesheet"
    >

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    >

    <!-- Our own styles -->
    <link rel="stylesheet" href="signup.css">
</head>

<body>

    <div class="container-fluid px-4">

        <!-- Page heading -->
        <h1 class="text-center text-primary mt-3 fw-bold">
            Sign up
        </h1>

        <hr>

        <!-- Main content -->
        <div class="row justify-content-center mt-5 ">

            <!-- Form side -->
            <div class="col-lg-7 col-md-8 order-2 order-md-1">

                <form id="signupForm">

                    <div class="mb-3">
                        <label for="firstName" class="form-label">
                            First Name :
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="firstName"
                            name="firstName"
                            placeholder="First Name"
                            required
                        >
                    </div>


                    <div class="mb-3">
                        <label for="lastName" class="form-label">
                            Last Name :
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="lastName"
                            name="lastName"
                            placeholder="Last Name"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="dob" class="form-label">
                            Date of Birth :
                        </label>

                        <input
                            type="date"
                            class="form-control"
                            id="dob"
                            name="dob"
                            required
                        >
                    </div>


                    <div class="mb-3">
                        <label for="employeeId" class="form-label">
                            Employee ID :
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="employeeId"
                            name="employeeId"
                            placeholder="Employee ID number"
                            required
                        >
                    </div>


                    <div class="mb-3">
                        <label for="email" class="form-label">
                            Email :
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            placeholder="email@address.com"
                            required
                        >
                    </div>


                    <div class="mb-3">
                        <label for="password" class="form-label">
                            Password :
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            placeholder="Password"
                            required
                        >
                    </div>
                    <div class="mb-3">
                        <label for="profilePicture" class="form-label">
                            Profile Picture :
                        </label>

                        <input
                            type="file"
                            class="form-control"
                            id="profilePicture"
                            name="profilePicture"
                            accept="image/*"
                        >
                    </div>


                    <div class="mb-3">
                        <label for="designation" class="form-label">
                            Designation :
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="designation"
                            name="designation"
                            placeholder="Designation"
                        >
                    </div>


                    <div class="mb-3">
                        <label for="contactNumber" class="form-label">
                            Contact Number :
                        </label>

                        <input
                            type="tel"
                            class="form-control"
                            id="contactNumber"
                            name="contactNumber"
                            placeholder="Contact Number"
                        >
                    </div>


                    <div class="mb-3">
                        <label for="address" class="form-label">
                            Address :
                        </label>

                        <textarea
                            class="form-control"
                            id="address"
                            name="address"
                            rows="3"
                            placeholder="Address"
                        ></textarea>
                    </div>


                    <div class="mb-3">
                        <label for="link" class="form-label">
                            Link :
                        </label>

                        <input
                            type="url"
                            class="form-control"
                            id="link"
                            name="link"
                            placeholder="https://example.com"
                        >
                    </div>


                    <div class="mb-3">
                        <label for="language" class="form-label">
                            Language :
                        </label>

                        <select
                            class="form-select"
                            id="language"
                            name="language"
                        >
                            <option value="">Select Language</option>
                            <option value="English">English</option>
                            <option value="Hindi">Hindi</option>
                        </select>
                    </div>

                    <div id="signupErrors" class="text-danger mb-3"></div>
                    <div class="d-flex justify-content-center mt-4 mb-5">
                        
                        <button type="submit" class="btn btn-primary w-75">
                            Sign Up
                        </button>
                    </div>

                </form>

            </div>

            <!-- Profile picture side -->
            <div class="col-lg-3 col-md-4 text-center order-1 order-md-2 mb-4">
                <i class="fa-solid fa-circle-user signup-avatar"></i>
            </div>

        </div>

    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>
    <script src="users.js"></script>
    <script src="signup.js"></script>   
</body>

</html>
