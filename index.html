<!DOCTYPE html>
<html lang="en">    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="logo-container">
        <img src="icon.svg" alt="Logo">
        <h1>P A T T E R N F L Y</h1>
    </div>
    <p class="intro-text">
        This is placeholder text, only. Use this area to place any information or introductory
        message about your application that may be relevant for users.
    </p>
    <div class="login-container">
        <div class="language-container">
            <select name="language" id="language">
                <option value="en">English</option>
                <option value="hi">Hindi</option>
                <option value="te">Telugu</option>
            </select>
        </div>
        <h2>Log In to Your Account</h2>
        <div>
            <form>
                <div class="input-container">
                    <input type="text" id="username" name="username" placeholder="Email or phone or username" required>
                    <input type="password" id="password" name="password" placeholder="Password" required>
                </div>
                <div class="form-options">
                    <div>
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">Keep me logged in for 30 days</label>
                    </div>
                    <a href="#">Forgot password?</a>
                </div>
                    <button class="login-button">Log In</button>
            </form>
            <p class="signup-text">Need an account? <a class="signup-link" href="signup.html">Sign Up</a></p>
        </div>
    </div>
    <p class="footer-text">Terms of Use · Help · Privacy Policy</p>
</body>
</html>
